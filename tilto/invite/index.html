<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Rejoins TILTO et viens relever un défi de quiz en duel.">
<meta property="og:title" content="Un défi t’attend sur TILTO">
<meta property="og:description" content="7 questions, 10 secondes par réponse. Rejoins ton ami sur TILTO.">
<meta property="og:type" content="website">
<title>Un défi t’attend — TILTO</title>
<style>
:root{color-scheme:light;--ink:#221b36;--muted:#6b6279;--purple:#6842e8;--lime:#d7f76b;--paper:#f7f6fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 0,#e8e0ff 0,transparent 45%),var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(100%,460px);background:white;border:1px solid #e9e4f1;border-radius:30px;padding:30px;box-shadow:0 18px 55px #221b3614}.brand{font-size:24px;font-weight:900;letter-spacing:-1px;color:var(--purple)}.tag{display:inline-block;margin-top:34px;padding:6px 12px;border-radius:20px;background:var(--lime);font-size:11px;font-weight:800;letter-spacing:.08em}h1{font-size:clamp(32px,9vw,48px);line-height:1.08;letter-spacing:-1.7px;margin:16px 0 12px}.copy{font-size:18px;color:var(--muted);margin:0}.topic{display:none;margin-top:22px;border-radius:18px;background:#f0ecfa;padding:15px 18px;color:var(--purple);font-weight:800}.actions{display:grid;gap:10px;margin-top:28px}.button{display:block;width:100%;border:0;border-radius:15px;padding:15px 18px;text-align:center;text-decoration:none;font:700 16px system-ui;cursor:pointer}.primary{background:var(--purple);color:white}.secondary{background:#f0ecfa;color:var(--purple)}.stores{display:flex;justify-content:center;gap:18px;margin-top:20px;font-size:13px}.stores a{color:var(--muted)}.foot{margin-top:25px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<main class="card">
  <div class="brand">TILTO.</div>
  <span class="tag" id="tag">DÉFI ENTRE AMIS</span>
  <h1 id="title">Un duel t’attend.</h1>
  <p class="copy" id="copy">Rejoins ton ami pour 7 questions de quiz. Tu as 10 secondes à chaque fois.</p>
  <div class="topic" id="topic"></div>
  <div class="actions">
    <a class="button primary" id="open" href="#">Ouvrir dans TILTO</a>
    <button class="button secondary" id="share" type="button">Transmettre l’invitation</button>
  </div>
  <div class="stores"><a href="https://apps.apple.com/fr/search?term=TILTO">Trouver sur l’App Store</a><a href="https://play.google.com/store/apps/details?id=com.lucaslbsq.tilto">Google Play</a></div>
  <p class="foot">Le lien ne s’ouvre pas ? Installe TILTO, puis rouvre cette invitation.</p>
</main>
<script>
const query=new URLSearchParams(location.search),code=query.get('c')||'',theme=query.get('t')||'',themeName=query.get('theme')||theme.replace(/[-_]/g,' '),daily=query.get('daily')==='1';
const topic=document.getElementById('topic'),title=document.getElementById('title'),copy=document.getElementById('copy'),tag=document.getElementById('tag'),open=document.getElementById('open');
if(theme){topic.textContent='THÈME · '+themeName;topic.style.display='block';title.textContent='Viens me défier.';copy.textContent='Ton ami t’attend sur ce thème : 7 questions, 10 secondes par réponse.'}
if(daily){tag.textContent='DÉFI DU JOUR';title.textContent='La même série pour tous.';copy.textContent='Joue les 7 questions du jour et compare ton score avec tes amis.'}
const params=new URLSearchParams();if(theme)params.set('topic',theme);if(daily)params.set('daily','1');
const deepParams=params.toString();open.href=code?'tilto://invite/'+encodeURIComponent(code)+(deepParams?'?'+deepParams:''):'https://play.google.com/store/apps/details?id=com.lucaslbsq.tilto';
document.getElementById('share').addEventListener('click',async()=>{if(navigator.share){try{await navigator.share({title:'Un défi t’attend sur TILTO',url:location.href})}catch{}}else{try{await navigator.clipboard.writeText(location.href);document.getElementById('share').textContent='Lien copié'}catch{}}});
</script>
</body>
</html>
