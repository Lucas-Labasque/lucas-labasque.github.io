<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable – Lucas Labasque</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png" type="image/png" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#1F2A44">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root { --nuit: #1F2A44; --nuit-fonce: #131B2E; --ecran: #2C3A5E; --creme: #FFF7E8; --ciel: #8ECDF5; --gris: #B9C3D9; }
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--nuit); color: var(--creme); font: 17px/1.6 Nunito, system-ui, sans-serif; padding: 48px 20px; }
  a { color: inherit; }
  a:focus-visible { outline: 3px solid currentColor; outline-offset: 3px; border-radius: 8px; }
  main { max-width: 560px; text-align: center; }
  .moi { width: 132px; aspect-ratio: 1; margin: 0 auto 30px; border-radius: 26%; overflow: hidden; background: var(--ciel); border: 6px solid #FFFFFF; box-shadow: 8px 8px 0 var(--nuit-fonce); transform: rotate(-5deg); }
  .moi img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center bottom; }
  h1 { margin: 0; font-family: Bungee, "Arial Black", sans-serif; font-weight: 400; font-size: clamp(32px, 9vw, 64px); line-height: 1; text-wrap: balance; }
  h1 span { display: block; color: var(--ciel); }
  p { margin: 18px auto 0; max-width: 28em; font-size: 19px; }
  p[lang="en"] { color: var(--gris); font-size: 16px; margin-top: 8px; }
  .liens { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 30px; }
  .liens a { display: inline-block; padding: 12px 20px; border-radius: 14px; background: var(--creme); color: var(--nuit); font-weight: 800; text-decoration: none; box-shadow: 0 5px 0 var(--nuit-fonce); }
  .liens a:hover { background: #FFFFFF; }
  .liens a:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--nuit-fonce); }
  .applis { list-style: none; padding: 0; margin: 40px 0 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
  .applis a { display: block; line-height: 0; }
  .applis img { width: 56px; height: 56px; border-radius: 14px; box-shadow: 0 4px 0 var(--nuit-fonce); transition: transform .15s ease-out; }
  .applis a:hover img { transform: translateY(-3px); }
</style>
</head>
<body>
<main>
  <div class="moi"><img src="/avatar.webp" alt="" width="280" height="280"></div>
  <h1>Oups <span>page introuvable</span></h1>
  <p>Cette page n'existe pas ou a déménagé. Tous mes jeux et applis sont sur l'accueil.</p>
  <p lang="en">This page doesn't exist or has moved. All my games and apps are on the home page.</p>
  <div class="liens">
    <a href="/">Retour à l'accueil</a>
    <a href="/en.html" lang="en">English home page</a>
  </div>
  <ul class="applis" aria-label="Mes jeux et applis">
    <li><a href="/tilto/"><img src="/tilto/icone-480.webp" alt="TILTO" width="56" height="56"></a></li>
    <li><a href="/wordly-3d/"><img src="/wordly-3d/icone-480.webp" alt="Wordly 3D" width="56" height="56"></a></li>
    <li><a href="/tap-le-pigeon/"><img src="/tap-le-pigeon/icone-480.webp" alt="Tap le pigeon" width="56" height="56"></a></li>
    <li><a href="/empile-les-crepes/"><img src="/empile-les-crepes/icone-480.webp" alt="Empile les crêpes" width="56" height="56"></a></li>
    <li><a href="/rappel-menage/"><img src="/rappel-menage/icone-480.webp" alt="Rappel Ménage" width="56" height="56"></a></li>
    <li><a href="/compteur-points/"><img src="/compteur-points/icone-480.webp" alt="Compteur de Points" width="56" height="56"></a></li>
    <li><a href="/mes-anniversaires/"><img src="/mes-anniversaires/icone-480.webp" alt="Mes Anniversaires" width="56" height="56"></a></li>
  </ul>
</main>
</body>
</html>
