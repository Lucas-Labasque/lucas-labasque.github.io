# Garde actif le projet Supabase de Rappel Ménage (plan gratuit : pause après
# environ 7 jours sans activité). La requête atteint la base mais ne renvoie
# aucune donnée, car les règles RLS bloquent un visiteur non connecté.
# La clé ci-dessous est la clé publique déjà embarquée dans l'application.
name: Rappel Ménage - garder Supabase actif

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Interroger la base
        run: |
          curl --fail --silent --show-error --max-time 30 \
            --retry 3 --retry-delay 30 --retry-all-errors \
            --output /dev/null --write-out 'HTTP %{http_code}\n' \
            --header "apikey: ${{ secrets.RAPPEL_MENAGE_SUPABASE_KEY }}" \
            "${{ secrets.RAPPEL_MENAGE_SUPABASE_URL }}/rest/v1/households?select=id&limit=1"
